name: Check public demo
on:
  workflow_dispatch:
permissions: {}
jobs:
  public-https:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify public DNS, trusted HTTPS, frontend and API
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          base = 'https://football.thedebeer.co.za'
          with urllib.request.urlopen(base + '/', timeout=30) as response:
              assert response.status == 200
              assert response.url.startswith(base)
              page = response.read().decode()
              assert 'Turning Point' in page
              assert "frame-ancestors 'none'" in response.headers.get('Content-Security-Policy', '')
              bundle = re.search(r'/assets/index-[^" ]+\.js', page).group()
          request = urllib.request.Request(base + bundle, method='HEAD')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 200
              assert int(response.headers['Content-Length']) > 10000
          with urllib.request.urlopen(base + '/api/health', timeout=30) as response:
              assert response.status == 200
              assert json.load(response)['status'] == 'ok'
              assert response.headers['Cache-Control'] == 'no-store'
          print('PASS: public GitHub runner resolved the domain, verified trusted HTTPS, and retrieved the frontend, current bundle and API health.')
          PY
