services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PROVIDER: mock
      MICROSOFT_INFERENCE_APPROVED: "false"
      DATABASE_PATH: /data/turning-point.sqlite3
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      MODEL_TIMEOUT_SECONDS: "3"
      MOCK_FAILURE: ${MOCK_FAILURE:-none}
      FIXTURE_CORRECTION: ${FIXTURE_CORRECTION:-0}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - replay-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
volumes:
  replay-data:
