# NPM is the only trusted source of X-Real-IP. Internet clients cannot choose
# their rate-limit identity by sending a forwarding header to this server.
set_real_ip_from 192.168.10.2;
real_ip_header X-Real-IP;
real_ip_recursive off;
server_tokens off;
log_format replay_safe '$request_method $uri $status $body_bytes_sent $request_time';
access_log /dev/stdout replay_safe;
client_max_body_size 16k;
client_body_timeout 10s;
client_header_timeout 10s;
large_client_header_buffers 2 8k;
send_timeout 15s;
gzip on;
gzip_types application/json application/javascript text/css image/svg+xml model/gltf-binary application/octet-stream;
gzip_min_length 1024;

server {
    listen 8080 default_server;
    server_name _;
    location = /health { access_log off; return 200 "ok\n"; }
    location / { return 444; }
}
server {
    listen 8080;
    server_name football.thedebeer.co.za;
    keepalive_timeout 10s;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /health { access_log off; return 200 "ok\n"; }
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host football.thedebeer.co.za;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
    location = /docs { return 404; }
    location = /redoc { return 404; }
    location = /openapi.json { return 404; }
    location = /release.json { try_files $uri =404; expires -1; access_log off; }
    location ~ /\. { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
